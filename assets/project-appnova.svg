<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="598" height="358" rx="11" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="12" fill="#131d2e"/>
  <rect x="0" y="30" width="600" height="12" fill="#131d2e"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" fill-opacity="0.8"/>

  <!-- Address Bar / Search -->
  <rect x="90" y="10" width="300" height="22" rx="6" fill="#0b0f17" stroke="#334155" stroke-width="1"/>
  <text x="104" y="25" fill="#64748b" font-family="monospace" font-size="11">localhost:3000/apps • AppNova Catalog</text>

  <!-- Badge Status -->
  <rect x="475" y="10" width="105" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="488" cy="21" r="3" fill="#10b981"/>
  <text x="498" y="25" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">REST API : ONLINE</text>

  <!-- Sub-header: AppNova Navigation -->
  <g transform="translate(30, 62)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">⚡ AppNova</text>

    <!-- Search box -->
    <rect x="120" y="0" width="220" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="134" cy="13" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="137" y1="16" x2="142" y2="21" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <text x="150" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Buscar aplicativo...</text>

    <!-- Filter chips -->
    <rect x="360" y="0" width="60" height="26" rx="6" fill="#2563eb" fill-opacity="0.25"/>
    <text x="375" y="17" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Todos</text>

    <rect x="428" y="0" width="70" height="26" rx="6" fill="#1e293b"/>
    <text x="438" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Utilitários</text>

    <rect x="506" y="0" width="34" height="26" rx="6" fill="#1e293b"/>
    <text x="513" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Dev</text>
  </g>

  <!-- App Cards Grid -->
  <g transform="translate(30, 108)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="168" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
    <rect x="22" y="22" width="24" height="24" rx="4" fill="#0284c7"/>
    <text x="14" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">DevTool Box</text>
    <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Utilitários para rotina</text>
    <text x="14" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">de desenvolvimento.</text>
    <rect x="14" y="130" width="45" height="18" rx="4" fill="#0f172a"/>
    <text x="20" y="142" fill="#38bdf8" font-family="monospace" font-size="9">Node.js</text>
    <rect x="65" y="130" width="55" height="18" rx="4" fill="#0f172a"/>
    <text x="71" y="142" fill="#10b981" font-family="monospace" font-size="9">MongoDB</text>
    <rect x="14" y="172" width="140" height="26" rx="6" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-opacity="0.4"/>
    <text x="50" y="189" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Detalhes →</text>

    <!-- Card 2 -->
    <rect x="186" y="0" width="168" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6"/>
    <rect x="200" y="14" width="40" height="40" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="208" y="22" width="24" height="24" rx="4" fill="#4f46e5"/>
    <text x="200" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Network Monitor</text>
    <text x="200" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Painel de visualização</text>
    <text x="200" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">de tráfego e nós.</text>
    <rect x="200" y="130" width="45" height="18" rx="4" fill="#0f172a"/>
    <text x="208" y="142" fill="#a855f7" font-family="monospace" font-size="9">REST</text>
    <rect x="251" y="130" width="45" height="18" rx="4" fill="#0f172a"/>
    <text x="259" y="142" fill="#38bdf8" font-family="monospace" font-size="9">JSON</text>
    <rect x="200" y="172" width="140" height="26" rx="6" fill="#334155" fill-opacity="0.4"/>
    <text x="236" y="189" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Detalhes →</text>

    <!-- Card 3 (New Item placeholder) -->
    <rect x="372" y="0" width="168" height="215" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4"/>
    <circle cx="456" cy="80" r="22" fill="#1e293b"/>
    <text x="449" y="87" fill="#38bdf8" font-size="20" font-weight="bold">+</text>
    <text x="408" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Novo Aplicativo</text>
    <text x="394" y="145" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Formulário de cadastro</text>
    <text x="404" y="160" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">integrado via POST</text>
  </g>
</svg>