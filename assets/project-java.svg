    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="395" height="56" rx="6" fill="#090e17" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="20" fill="#10b981" font-family="monospace" font-size="10">✔ BUILD SUCCESSFUL in 840ms</text>
      <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="10">> Testes de herança e polimorfismo: 12 passados</text>
