    <text x="28" y="92" fill="#f43f5e" font-family="monospace" font-size="11">    public </text>
    <text x="76" y="92" fill="#38bdf8" font-family="monospace" font-size="11">void </text>
    <text x="110" y="92" fill="#a78bfa" font-family="monospace" font-size="11">adicionar</text>
    <text x="175" y="92" fill="#e2e8f0" font-family="monospace" font-size="11">(Usuario u) {</text>

    <text x="0" y="116" fill="#475569" font-family="monospace" font-size="11">05</text>
    <text x="28" y="116" fill="#f43f5e" font-family="monospace" font-size="11">        if </text>
    <text x="50" y="116" fill="#e2e8f0" font-family="monospace" font-size="11">(u != </text>
    <text x="96" y="116" fill="#f43f5e" font-family="monospace" font-size="11">null</text>
    <text x="124" y="116" fill="#e2e8f0" font-family="monospace" font-size="11">) {</text>

    <text x="0" y="140" fill="#475569" font-family="monospace" font-size="11">06</text>
    <text x="28" y="140" fill="#e2e8f0" font-family="monospace" font-size="11">            this.usuarios.add(u);</text>

    <text x="0" y="164" fill="#475569" font-family="monospace" font-size="11">07</text>
    <text x="28" y="164" fill="#e2e8f0" font-family="monospace" font-size="11">        }</text>

    <text x="0" y="188" fill="#475569" font-family="monospace" font-size="11">08</text>
    <text x="28" y="188" fill="#e2e8f0" font-family="monospace" font-size="11">    }</text>

    <text x="0" y="212" fill="#475569" font-family="monospace" font-size="11">09</text>
    <text x="28" y="212" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>

